name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    name: Tag gate / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Run release-equivalent gate
        shell: pwsh
        run: ./scripts/check.ps1

  release:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run release gate
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Verify annotated tag is on main
        run: |
          git fetch origin main
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          git merge-base --is-ancestor "$GITHUB_REF_NAME^{}" origin/main
      - name: Package source, examples, and checksums
        run: uv run python scripts/package_release.py "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          gh release create "$tag" dist/* --verify-tag --generate-notes --title "SensorSieve $tag"
