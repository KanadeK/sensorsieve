name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Run release-equivalent gate
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Explain fixture drift
        if: failure() && matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        shell: pwsh
        run: |
          @'
          import io
          import json
          import subprocess
          from pathlib import Path
          import numpy as np
          from PIL import Image, features
          print(json.dumps({"zlib": features.version("zlib"), "zlib_ng": features.version("zlib_ng")}))
          for path in sorted(Path("examples").rglob("*.png")):
              original = subprocess.check_output(["git", "show", f"HEAD:{path.as_posix()}"])
              expected = np.asarray(Image.open(io.BytesIO(original)))
              actual = np.asarray(Image.open(path))
              print(json.dumps({"file": path.as_posix(), "encoded_equal": original == path.read_bytes(), "different_pixels": int(np.count_nonzero(expected != actual))}))
          '@ | uv run python -
      - name: Upload built distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: sensorsieve-distributions
          path: dist/
          if-no-files-found: error
